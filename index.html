<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENVI TEAM | Yamaha System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav>
        <div class="logo-area">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/8b/Yamaha_Motor_Logo.svg" alt="Yamaha Logo" width="100">
            <span class="brand-name">ENVI TEAM</span>
        </div>
        <div id="nav-links"></div>
        <button id="logout-btn" class="hidden" onclick="logout()">Logout</button>
    </nav>

    <div class="container">
        <section id="login-section" class="card">
            <h2>System Login</h2>
            <input type="text" id="login-user" placeholder="Username">
            <input type="password" id="login-pass" placeholder="Password">
            <button class="btn-primary" onclick="login()">Sign In</button>
        </section>

        <section id="admin-dashboard" class="hidden">
            <div class="header-flex">
                <h2>Admin Dashboard</h2>
                <button onclick="exportToExcel()" class="btn-export">📥 Export to Excel</button>
            </div>
            <div class="chart-container">
                <canvas id="monthlyChart"></canvas>
            </div>
            <h3>Recent Global Records</h3>
            <table id="admin-table">
                <thead>
                    <tr><th>Date</th><th>User</th><th>Type</th><th>Qty</th></tr>
                </thead>
                <tbody id="admin-all-records"></tbody>
            </table>
        </section>

        <section id="admin-users" class="hidden">
            <h2>User Management</h2>
            <div class="add-user-box">
                <input type="text" id="new-name" placeholder="Full Name">
                <input type="text" id="new-username" placeholder="Username">
                <select id="new-role">
                    <option value="scrap1">Scrap 1</option>
                    <option value="scrap2">Scrap 2</option>
                    <option value="waste">Waste Hazard</option>
                </select>
                <button class="btn-primary" onclick="addUser()">Create Account</button>
            </div>
            <table>
                <thead>
                    <tr><th>Name</th><th>Role</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="user-list-body"></tbody>
            </table>
        </section>

        <section id="user-add-scrap" class="hidden">
            <h2>Add Scrap Record</h2>
            <form id="scrap-form">
                <input type="date" id="date" required>
                <input type="text" id="personnel" placeholder="Assign Personnel" required>
                <input type="number" id="qty" placeholder="Bilang ng Scrap" required>
                <select id="scrap-type">
                    <option value="Garbage">Garbage</option>
                    <option value="Carton">Carton</option>
                    <option value="Waste Pallet">Waste Pallet</option>
                    <option value="Pallet">Pallet</option>
                </select>
                <button type="submit" class="btn-primary">Submit Record</button>
            </form>
        </section>

        <section id="user-view-scrap" class="hidden">
            <h2>My Scrap Records</h2>
            <table id="records-table">
                <thead>
                    <tr><th>Date</th><th>Personnel</th><th>Type</th><th>Qty</th><th>Actions</th></tr>
                </thead>
                <tbody id="scrap-list"></tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
